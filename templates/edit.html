{% extends "base.html" %}

{% block content %}

<section class="edit-page section">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="surface application-form">

                <!-- ================= HEADER ================= -->

                <div class="section-header">

                    <div>

                        <h2 class="section-title">

                            Edit Application

                        </h2>

                        <p class="section-subtitle">

                            Update the progress of your application.

                        </p>

                    </div>

                </div>

                <!-- ================= COMPANY ================= -->

                <div class="application-info">

                    <span class="application-label">

                        Company

                    </span>

                    <h3 class="application-company">

                        {{ application.job.title }}

                    </h3>

                </div>

                <!-- ================= FORM ================= -->

                <form method="POST">

                    <div class="form-group">

                        <label for="status">

                            Status

                        </label>

                        <select
                            id="status"
                            name="status"
                            class="form-select">

                            <option {% if application.status == "Applied" %}selected{% endif %}>Applied</option>

                            <option {% if application.status == "Interview" %}selected{% endif %}>Interview</option>

                            <option {% if application.status == "Selected" %}selected{% endif %}>Selected</option>

                            <option {% if application.status == "Rejected" %}selected{% endif %}>Rejected</option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label for="stage">

                            Stage

                        </label>

                        <select
                            id="stage"
                            name="stage"
                            class="form-select">

                            <option {% if application.stage == "Resume Screening" %}selected{% endif %}>Resume Screening</option>

                            <option {% if application.stage == "OA" %}selected{% endif %}>OA</option>

                            <option {% if application.stage == "Round 1" %}selected{% endif %}>Round 1</option>

                            <option {% if application.stage == "Round 2" %}selected{% endif %}>Round 2</option>

                            <option {% if application.stage == "HR" %}selected{% endif %}>HR</option>

                            <option {% if application.stage == "Offer" %}selected{% endif %}>Offer</option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label for="notes">

                            Notes

                        </label>

                        <textarea
                            id="notes"
                            name="notes"
                            rows="5"
                            class="form-control"
                            placeholder="Add useful notes about this application...">{{ application.notes }}</textarea>

                    </div>

                    <div class="form-footer">

                        <a
                            href="{{ url_for('home') }}"
                            class="btn-secondary">

                            Cancel

                        </a>

                        <button
                            type="submit"
                            class="btn-primary">

                            <i class="bi bi-check-circle"></i>

                            <span>

                                Save Changes

                            </span>

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</section>

{% endblock %}
